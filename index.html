<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Alvarados" />
    <meta name="description" content="Kiosko 24/7 Empresas Alvarados: pedidos al instante, retiro en tienda o entrega a domicilio." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Kiosko 24/7 · Empresas Alvarados</title>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif;padding:24px;text-align:center">
        <div>
          <p style="font-weight:700;font-size:16px;margin:0 0 8px">Cargando Kiosko 24/7…</p>
          <p style="font-size:13px;color:#94a3b8;margin:0">
            Si esta pantalla no cambia, recarga la página o cierra y vuelve a abrir la app.
          </p>
        </div>
      </div>
    </div>
    <noscript>
      <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif;padding:24px;text-align:center">
        <p style="font-size:14px;font-weight:600">Kiosko 24/7 necesita JavaScript activado para funcionar.</p>
      </div>
    </noscript>
    <script>
      // Si la app no monta en ~10s, la caché del service worker puede estar rota
      // (apunta a archivos que ya no existen). Muestra un botón para limpiarla.
      setTimeout(function () {
        if (window.__APP_MOUNTED__) return;
        var root = document.getElementById('root');
        var box = root && root.firstElementChild;
        if (!box) return;
        var btn = document.createElement('button');
        btn.textContent = 'Limpiar caché y recargar';
        btn.onclick = function () {
          var done = function () { window.location.reload(); };
          if ('caches' in window) {
            caches.keys()
              .then(function (keys) { return Promise.all(keys.map(function (k) { return caches.delete(k); })); })
              .then(done)
              .catch(done);
          } else { done(); }
        };
        btn.style.cssText = 'margin-top:16px;padding:10px 18px;border:none;border-radius:10px;background:#14b8a6;color:#0f172a;font-weight:700;font-size:14px;cursor:pointer';
        box.appendChild(btn);
      }, 10000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
