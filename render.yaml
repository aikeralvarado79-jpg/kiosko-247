services:
  - type: web
    name: kiosko-247
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ADMIN_PASSWORD
        sync: false
        # Contraseña del panel admin. Ej: kiosko247Aa
      - key: DATABASE_URL
        sync: false
        # Connection string de Supabase (Transaction pooler, puerto 6543).
        # Ej: postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:6543/postgres
