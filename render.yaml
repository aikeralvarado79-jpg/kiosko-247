services:
  - type: web
    name: kiosko-247
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ADMIN_PASSWORD
        value: 123456
        sync: false
        # Contraseña del panel admin (aplicada al crear el servicio; con sync:
        # false no sobreescribe la que ya esté definida en el dashboard).
      - key: ADMIN_PHONES
        sync: false
        # Teléfonos admin separados por coma (para recuperar contraseña con biometría).
        # Ej: 04129862577,04141823718,04242980404,04242963490
      - key: DATABASE_URL
        sync: false
        # Connection string de Postgres. BD activa: Neon (plan free, 0.5 GB).
        # Ej: postgresql://neondb_owner:<pass>@ep-<branch>.region.aws.neon.tech/neondb?sslmode=require
        # Supabase quedó como respaldo (suspendida por exceso de egreso, ago 2026);
        # al reactivarla se puede volver a apuntar aquí (transaction pooler, puerto 6543).
      - key: SUPABASE_URL
        sync: false
        # URL del proyecto Supabase (https://xxxx.supabase.co). Solo para el
        # Storage de comprobantes (la BD ya vive en Neon). Si se define junto a
        # SUPABASE_SERVICE_KEY, los comprobantes se suben a Storage en vez de
        # guardarse como base64 en la BD (mucho menos ancho de banda). Si el
        # upload falla (p. ej. Supabase suspendida), se guarda el base64.
      - key: SUPABASE_SERVICE_KEY
        sync: false
        # Secret key de Supabase (sb_secret_...). Preferida para el server:
        # sube los comprobantes al bucket con permisos de service_role.
      - key: SUPABASE_ANON_KEY
        sync: false
        # Publishable key de Supabase (sb_publishable_... o anon key).
        # Fallback de subida si no hay SUPABASE_SERVICE_KEY.
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
        # Bucket de Storage para los comprobantes (default: comprobantes).
        # Debe existir y ser público (lectura).

  # Ambiente de pruebas: se despliega automáticamente con la rama develop.
  # URL esperada: https://kiosko-247-staging.onrender.com
  - type: web
    name: kiosko-247-staging
    runtime: node
    plan: free
    branch: develop
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ADMIN_PASSWORD
        sync: false
        # Contraseña distinta para staging (no usar la de producción).
        # Ej: staging247Aa
      - key: ADMIN_PHONES
        sync: false
        # Teléfonos admin (mismos que producción si querés probar biometría).
      - key: DATABASE_URL
        sync: false
        # Connection string de Neon (misma BD que producción pero schema "staging",
        # vía KIOSKO_DB_SCHEMA). El espejo automático copia public -> staging.
        # WARNING: NO apuntar a la BD de producción en schema public; solo probá
        # UI/navegación o crearás pedidos que ensucian los datos reales.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
