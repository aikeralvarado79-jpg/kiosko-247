services:
  - type: web
    name: kiosko-247
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ADMIN_PASSWORD
        sync: false
        # Contraseña del panel admin. Ej: kiosko247Aa
      - key: ADMIN_PHONES
        sync: false
        # Teléfonos admin separados por coma (para recuperar contraseña con biometría).
        # Ej: 04129862577,04141823718,04242980404,04242963490
      - key: DATABASE_URL
        sync: false
        # Connection string de Supabase (Transaction pooler, puerto 6543).
        # Ej: postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:6543/postgres
      - key: SUPABASE_URL
        sync: false
        # URL del proyecto Supabase (https://xxxx.supabase.co). Si se define junto
        # a SUPABASE_SERVICE_KEY, los comprobantes se suben a Storage en vez de
        # guardarse como base64 en la BD (mucho menos ancho de banda).
      - key: SUPABASE_SERVICE_KEY
        sync: false
        # Secret key de Supabase (sb_secret_...). Preferida para el server:
        # sube los comprobantes al bucket con permisos de service_role.
      - key: SUPABASE_ANON_KEY
        sync: false
        # Publishable key de Supabase (sb_publishable_... o anon key).
        # Fallback de subida si no hay SUPABASE_SERVICE_KEY.
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
        # Bucket de Storage para los comprobantes (default: comprobantes).
        # Debe existir y ser público (lectura).

  # Ambiente de pruebas: se despliega automáticamente con la rama develop.
  # URL esperada: https://kiosko-247-staging.onrender.com
  - type: web
    name: kiosko-247-staging
    runtime: node
    plan: free
    branch: develop
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ADMIN_PASSWORD
        sync: false
        # Contraseña distinta para staging (no usar la de producción).
        # Ej: staging247Aa
      - key: ADMIN_PHONES
        sync: false
        # Teléfonos admin (mismos que producción si querés probar biometría).
      - key: DATABASE_URL
        sync: false
        # WARNING: temporalmente apunta a la misma BD que producción.
        # Solo probá UI/navegación; NO crees pedidos ni modifiques stock desde
        # staging, o ensuciarás los datos reales del kiosko.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
